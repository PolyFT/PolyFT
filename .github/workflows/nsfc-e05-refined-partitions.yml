name: NSFC E05 completed base - refined partitions

on:
  push:
    branches: [nsfc-e-data-runner]
    paths:
      - ".github/workflows/nsfc-e05-refined-partitions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsfc-e05-refined-partitions
  cancel-in-progress: false

jobs:
  early-root:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests pycryptodome
      - name: Collect complete historical E05 root window
        run: |
          python tools/nsfc_e_collect.py \
            --code E05 \
            --start-conclusion-year 1986 \
            --end-conclusion-year 2014 \
            --page-size 10 \
            --delay 0.65 \
            --retries 10 \
            --output-dir outputs/e05-root-1986-2014
      - uses: actions/upload-artifact@v4
        with:
          name: nsfc-e-refined-E05-root-1986-2014
          path: outputs/e05-root-1986-2014
          if-no-files-found: error
          retention-days: 30

  late-subcodes:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        code: [E0501, E0502, E0503, E0504, E0505, E0506, E0507, E0508, E0509, E0510, E0511, E0512]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests pycryptodome
      - name: Collect late E05 subcode partition
        run: |
          code_lower="$(echo '${{ matrix.code }}' | tr '[:upper:]' '[:lower:]')"
          python tools/nsfc_e_collect.py \
            --code "${{ matrix.code }}" \
            --start-conclusion-year 2015 \
            --end-conclusion-year 2026 \
            --page-size 10 \
            --delay 0.65 \
            --retries 10 \
            --output-dir "outputs/${code_lower}-2015-2026"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsfc-e-refined-${{ matrix.code }}-2015-2026
          path: outputs
          if-no-files-found: error
          retention-days: 30
