name: NSFC E official completed base

on:
  push:
    branches: [nsfc-e-data-runner]
    paths:
      - ".github/workflows/nsfc-e-official-completed-base.yml"
      - "tools/nsfc_e_collect.py"
      - "tools/nsfc_e_merge.py"
      - "tools/nsfc_e_root_reference.py"
      - "tools/nsfc_e_reconcile.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsfc-e-official-completed-base-v2
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests pycryptodome
      - name: Collect E root reference totals
        run: |
          python tools/nsfc_e_root_reference.py \
            --start-conclusion-year 1986 \
            --end-conclusion-year 2026 \
            --retries 8 \
            --output outputs/reference/nsfc_e_root_reference_totals.json
      - uses: actions/upload-artifact@v4
        with:
          name: nsfc-e-root-reference
          path: outputs/reference
          if-no-files-found: error
          retention-days: 30

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        code: [E01, E02, E03, E04, E05, E06, E07, E08, E09, E10, E11, E12, E13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests pycryptodome
      - name: Collect one E first-level code
        run: |
          python tools/nsfc_e_collect.py \
            --code ${{ matrix.code }} \
            --start-conclusion-year 1986 \
            --end-conclusion-year 2026 \
            --page-size 100 \
            --delay 0.10 \
            --retries 8 \
            --output-dir outputs/${{ matrix.code }}
      - name: Upload code partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsfc-e-code-${{ matrix.code }}
          path: outputs/${{ matrix.code }}
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: [reference, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download E01-E13 partitions
        uses: actions/download-artifact@v4
        with:
          pattern: nsfc-e-code-*
          path: shards
          merge-multiple: true
      - name: Download root reference totals
        uses: actions/download-artifact@v4
        with:
          name: nsfc-e-root-reference
          path: reference
      - name: Merge, audit, and learn E number segments
        run: |
          python tools/nsfc_e_merge.py \
            --input-root shards \
            --output-dir outputs/nsfc-e-official-completed-base
      - name: Reconcile E01-E13 against E root totals
        run: |
          python tools/nsfc_e_reconcile.py \
            --input-root shards \
            --reference-json reference/nsfc_e_root_reference_totals.json \
            --output-dir outputs/nsfc-e-official-completed-base
      - name: Upload final E base dataset
        uses: actions/upload-artifact@v4
        with:
          name: nsfc-e-official-completed-base
          path: outputs/nsfc-e-official-completed-base
          if-no-files-found: error
          retention-days: 30
      - name: Persist synchronized dataset on the data branch
        run: |
          set -euo pipefail
          SRC=outputs/nsfc-e-official-completed-base
          DEST=data/nsfc-e-official-completed-base
          rm -rf "$DEST"
          mkdir -p "$DEST"
          for name in \
            nsfc_e_completed_master.csv.gz \
            nsfc_e_completed_master.sqlite \
            nsfc_e_number_learning_observations.csv.gz \
            nsfc_e_number_segment_rules.csv \
            nsfc_e_counts_by_year_code_type.csv \
            nsfc_e_completed_coverage.json \
            nsfc_e_partition_reconciliation.csv \
            nsfc_e_partition_reconciliation.json \
            nsfc_e_partition_counts_by_code_year.csv \
            nsfc_e_merge_conflicts.jsonl \
            dataset_manifest.json \
            EXECUTION_SUMMARY.md; do
            test -f "$SRC/$name" && cp "$SRC/$name" "$DEST/$name"
          done
          if test -f "$SRC/nsfc_e_completed_raw.jsonl.gz"; then
            size=$(stat -c%s "$SRC/nsfc_e_completed_raw.jsonl.gz")
            if [ "$size" -lt 90000000 ]; then
              cp "$SRC/nsfc_e_completed_raw.jsonl.gz" "$DEST/"
            else
              split -b 85M -d -a 3 "$SRC/nsfc_e_completed_raw.jsonl.gz" "$DEST/nsfc_e_completed_raw.jsonl.gz.part-"
              printf '%s\n' 'Reassemble with: cat nsfc_e_completed_raw.jsonl.gz.part-* > nsfc_e_completed_raw.jsonl.gz' > "$DEST/RAW_REASSEMBLY.txt"
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "data: persist E official completed-project base" || exit 0
          git push origin HEAD:nsfc-e-data-runner
