name: NSFC E official completed base

on:
  push:
    branches: [nsfc-e-data-runner]
    paths:
      - ".github/workflows/nsfc-e-official-completed-base.yml"
      - "tools/nsfc_e_collect.py"
      - "tools/nsfc_e_merge.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsfc-e-official-completed-base
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: 1986-1999
            start: 1986
            end: 1999
          - label: 2000-2009
            start: 2000
            end: 2009
          - label: 2010-2019
            start: 2010
            end: 2019
          - label: 2020-2026
            start: 2020
            end: 2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests pycryptodome
      - name: Collect E completed-project shard
        run: |
          python tools/nsfc_e_collect.py \
            --code E \
            --start-conclusion-year ${{ matrix.start }} \
            --end-conclusion-year ${{ matrix.end }} \
            --page-size 100 \
            --delay 0.20 \
            --retries 8 \
            --output-dir outputs/${{ matrix.label }}
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsfc-e-shard-${{ matrix.label }}
          path: outputs/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: nsfc-e-shard-*
          path: shards
          merge-multiple: true
      - name: Merge, audit, and learn E number segments
        run: |
          python tools/nsfc_e_merge.py \
            --input-root shards \
            --output-dir outputs/nsfc-e-official-completed-base
      - name: Upload final E base dataset
        uses: actions/upload-artifact@v4
        with:
          name: nsfc-e-official-completed-base
          path: outputs/nsfc-e-official-completed-base
          if-no-files-found: error
          retention-days: 30
